<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/shared.css" />
  <title>Kiln Monitor Events</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Avenir Next", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      --bg: #081018;
      --bg-soft: #112033;
      --panel: rgba(13, 23, 39, 0.94);
      --panel-strong: rgba(17, 31, 52, 0.98);
      --border: rgba(125, 211, 252, 0.20);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      color: var(--text);
    }
    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.20), transparent 28%),
        radial-gradient(circle at bottom right, rgba(14, 165, 233, 0.12), transparent 25%),
        linear-gradient(180deg, #10213a 0%, var(--bg) 58%);
    }
    main {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .page-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }
    .page-link {
      border: 1px solid rgba(148, 163, 184, 0.24);
      background: rgba(15, 23, 42, 0.48);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 14px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      font-weight: 700;
      min-height: 44px;
    }
    .page-link.active-page {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.18);
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 {
      margin: 0;
      font-size: 2rem;
    }
    .card {
      background:
        linear-gradient(180deg, rgba(17, 31, 52, 0.98), rgba(13, 23, 39, 0.94));
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 16px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
    }
    .section-grid {
      display: grid;
      gap: 16px;
      grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
      align-items: start;
    }
    .label {
      color: var(--muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .subtle {
      color: var(--muted);
      font-size: 0.9rem;
    }
    .event-form-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    }
    label {
      display: block;
      color: var(--muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(15, 23, 42, 0.66);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .rule-actions, .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    button {
      border: 1px solid #334155;
      background: rgba(15, 23, 42, 0.74);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 600;
    }
    .success-text, .error-text {
      min-height: 1.2em;
      margin-top: 12px;
    }
    .success-text {
      color: #86efac;
    }
    .error-text {
      color: #fca5a5;
    }
    .rules-table-wrap {
      overflow-x: auto;
      margin-top: 14px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
    }
    th, td {
      text-align: left;
      padding: 10px 8px;
      border-top: 1px solid #1f2937;
      font-size: 0.95rem;
      vertical-align: top;
    }
    .pill {
      display: inline-block;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      background: rgba(56, 189, 248, 0.16);
      color: #bae6fd;
    }
    @media (max-width: 960px) {
      .section-grid {
        grid-template-columns: 1fr;
      }
    }
    @media (max-width: 720px) {
      body {
        padding: 14px;
      }
      .page-header {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main>
    <div data-app-header data-active-page="events" data-title="Events" data-subtitle="Add run markers here and review the full recent event list without crowding the main dashboard.">
      <template data-header-actions>
        <button type="button" id="refreshEventsButton">Refresh Events</button>
      </template>
    </div>

    <section class="section-grid">
      <section class="card">
        <div class="label">Add Event Marker</div>
        <div class="subtle">Use this page for operational notes that should line up with the chart and future event history.</div>
        <form id="eventForm">
          <div class="event-form-grid">
            <div>
              <label for="eventType">Event Type</label>
              <select id="eventType" name="event_type">
                <option value="OPERATION">Operation</option>
                <option value="POWER">Power</option>
                <option value="OBSERVATION">Observation</option>
                <option value="NOTE">Note</option>
              </select>
            </div>
            <div>
              <label for="eventLabel">Label</label>
              <input id="eventLabel" name="label" placeholder="Turned third coil on" required />
            </div>
            <div style="grid-column: 1 / -1;">
              <label for="eventDetail">Detail</label>
              <input id="eventDetail" name="detail" placeholder="Optional extra note" />
            </div>
          </div>
          <div class="rule-actions" style="margin-top: 12px;">
            <button type="submit">Add Marker</button>
          </div>
          <div id="eventStatus" class="success-text"></div>
        </form>
      </section>

      <section class="card">
        <div class="label">Recent Events</div>
        <div class="subtle">Showing the 100 most recent event markers.</div>
        <div class="filter-grid">
          <div>
            <label for="eventFilterType">Type</label>
            <select id="eventFilterType">
              <option value="">All Types</option>
              <option value="OPERATION">Operation</option>
              <option value="POWER">Power</option>
              <option value="OBSERVATION">Observation</option>
              <option value="NOTE">Note</option>
            </select>
          </div>
          <div>
            <label for="eventFilterSearch">Search</label>
            <input id="eventFilterSearch" type="text" placeholder="Label or detail" />
          </div>
          <div>
            <label for="eventFilterStart">Start</label>
            <input id="eventFilterStart" type="datetime-local" />
          </div>
          <div>
            <label for="eventFilterEnd">End</label>
            <input id="eventFilterEnd" type="datetime-local" />
          </div>
        </div>
        <div class="rule-actions" style="margin-top: 12px;">
          <button type="button" id="applyEventFiltersButton">Apply Filters</button>
          <button type="button" id="clearEventFiltersButton">Clear Filters</button>
        </div>
        <div class="rules-table-wrap">
          <table>
            <thead>
              <tr>
                <th>Time</th>
                <th>Type</th>
                <th>Label</th>
                <th>Detail</th>
                <th>Captured State</th>
              </tr>
            </thead>
            <tbody id="eventsTableBody">
              <tr><td colspan="5" class="subtle">Loading events...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script src="/static/common.js"></script>
  <script>
    const eventForm = document.getElementById("eventForm");
    const eventStatus = document.getElementById("eventStatus");
    const eventsTableBody = document.getElementById("eventsTableBody");
    const eventFilterType = document.getElementById("eventFilterType");
    const eventFilterSearch = document.getElementById("eventFilterSearch");
    const eventFilterStart = document.getElementById("eventFilterStart");
    const eventFilterEnd = document.getElementById("eventFilterEnd");

    const formatTimestamp = (isoText) => window.KilnUI.formatTimestamp(isoText);

    function setStatusMessage(message, isError = false) {
      eventStatus.textContent = message;
      eventStatus.classList.toggle("success-text", !isError);
      eventStatus.classList.toggle("error-text", isError);
    }

    function renderEvents(events) {
      if (!events.length) {
        eventsTableBody.innerHTML = '<tr><td colspan="5" class="subtle">No events recorded yet.</td></tr>';
        return;
      }
      eventsTableBody.innerHTML = "";
      events.forEach((item) => {
        const capturedState = item.temp_f !== null && item.temp_f !== undefined
          ? `${Number(item.temp_f).toFixed(1)} F / ${Number(item.temp_c).toFixed(1)} C`
          : (item.sample_status || "no sample context");
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${formatTimestamp(item.timestamp_utc)}<div class="subtle">${item.sample_age}</div></td>
          <td><span class="pill">${item.event_type}</span></td>
          <td>${item.label}</td>
          <td>${item.detail || ""}</td>
          <td>${capturedState}${item.sample_detail ? `<div class="subtle">${item.sample_detail}</div>` : ""}</td>
        `;
        eventsTableBody.appendChild(row);
      });
    }

    async function refreshEvents() {
      const params = new URLSearchParams({ limit: "100" });
      if (eventFilterType.value) params.set("event_type", eventFilterType.value);
      if (eventFilterSearch.value.trim()) params.set("search", eventFilterSearch.value.trim());
      if (eventFilterStart.value) params.set("start", new Date(eventFilterStart.value).toISOString());
      if (eventFilterEnd.value) params.set("end", new Date(eventFilterEnd.value).toISOString());
      const response = await fetch(`/api/events?${params.toString()}`);
      const payload = await response.json();
      renderEvents(payload.events || []);
    }

    eventForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      setStatusMessage("Saving marker...");
      try {
        await window.KilnUI.postJson("/api/events", {
          event_type: document.getElementById("eventType").value,
          label: document.getElementById("eventLabel").value.trim(),
          detail: document.getElementById("eventDetail").value.trim(),
        });
        eventForm.reset();
        document.getElementById("eventType").value = "OPERATION";
        setStatusMessage("Event marker added.");
        await refreshEvents();
      } catch (error) {
        setStatusMessage(error instanceof Error ? error.message : String(error), true);
      }
    });

    document.getElementById("refreshEventsButton").addEventListener("click", async () => {
      await refreshEvents();
    });

    document.getElementById("applyEventFiltersButton").addEventListener("click", async () => {
      await refreshEvents();
    });

    document.getElementById("clearEventFiltersButton").addEventListener("click", async () => {
      eventFilterType.value = "";
      eventFilterSearch.value = "";
      eventFilterStart.value = "";
      eventFilterEnd.value = "";
      await refreshEvents();
    });

    refreshEvents();
    setInterval(refreshEvents, 5000);
  </script>
</body>
</html>
